name: Financial Telemetry Ingestion Loop

on:
  schedule:
    - cron: '0 17 * * *'
  push:
    branches: [ main ]

jobs:
  ingest-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code Base
      uses: actions/checkout@v4

    - name: Initialize Enterprise Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Resolve Pipeline Dependencies
# Added r-base installation step directly within runner initialization layouts
# This ensures local python validation passes smoothly inside the GitHub virtual environment
      run: |
        sudo apt-get update && sudo apt-get install -y r-base r-cran-jsonlite
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Live Ingestion and Verification Script
      env:
        # Injects your secure Azure secrets block straight into environmental runtime metrics
        AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      run: python pipeline.py
